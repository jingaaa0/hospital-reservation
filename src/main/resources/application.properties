spring.application.name=hospital-reservation

# Local Docker PostgreSQL connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hospital_reservation}
spring.datasource.username=${DB_USERNAME:hospital_admin}
spring.datasource.password=${DB_PASSWORD:local_dev_password}

# JPA defaults for the initial development stage
# Entity changes create or update local tables automatically.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
