<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="늘봄의원 관리자 로그인">
  <title>관리자 로그인 | 늘봄의원</title>
  <link rel="stylesheet" href="/admin/login.css">
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="login-title">
      <a class="brand" href="/">늘봄의원 <span>관리자</span></a>
      <div class="heading">
        <p>ADMIN</p>
        <h1 id="login-title">관리자 로그인</h1>
        <span>문의와 예약을 안전하게 관리하세요.</span>
      </div>
      <p class="notice error" th:if="${param.error}" role="alert">아이디 또는 비밀번호가 올바르지 않습니다.</p>
      <p class="notice success" th:if="${param.logout}" role="status">안전하게 로그아웃되었습니다.</p>
      <form th:action="@{/admin/login}" method="post">
        <label for="username">아이디</label>
        <input id="username" name="username" type="text" autocomplete="username" autofocus required>
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">로그인</button>
      </form>
      <a class="home-link" href="/">← 홈페이지로 돌아가기</a>
    </section>
  </main>
</body>
</html>
