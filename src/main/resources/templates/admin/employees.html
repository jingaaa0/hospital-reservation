<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="늘봄의원 관리자 직원 관리">
  <title>직원 관리 | 늘봄의원 관리자</title>
  <link rel="stylesheet" href="/admin/admin.css">
  <link rel="stylesheet" href="/admin/employees.css?v=2">
</head>
<body>
  <main class="admin-layout">
    <aside th:replace="~{admin/fragments/sidebar :: sidebar('employees')}"></aside>

    <section class="content employee-content">
      <header th:replace="~{admin/fragments/page-header :: pageHeader(
        '직원 관리',
        '직원 목록',
        '등록된 직원 정보를 관리하세요.'
      )}"></header>

      <nav class="employee-filters" aria-label="직원 유형 필터">
        <div class="filter-buttons">
          <button class="employee-filter active" type="button" data-employee-filter="ALL" aria-pressed="true">전체 보기</button>
          <button class="employee-filter" type="button" data-employee-filter="DOCTOR" aria-pressed="false">의사</button>
          <button class="employee-filter" type="button" data-employee-filter="STAFF" aria-pressed="false">일반 직원</button>
        </div>
        <button id="add-employee-button" class="add-employee-button" type="button">+ 직원 추가</button>
      </nav>

      <section class="employee-panel" aria-labelledby="employee-list-title">
        <div class="panel-heading">
          <h2 id="employee-list-title">전체 직원</h2>
          <p id="list-message" role="status"></p>
        </div>
        <div class="table-scroll">
          <table class="employee-table">
            <thead>
              <tr>
                <th>구분</th>
                <th>성명</th>
                <th>부서</th>
                <th>직함</th>
                <th>생년월일</th>
                <th>재직 상태</th>
                <th>수정 / 삭제</th>
              </tr>
            </thead>
            <tbody id="employee-list"></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <dialog id="employee-dialog" class="employee-dialog" aria-labelledby="employee-dialog-title">
    <form id="employee-form">
      <div class="dialog-heading">
        <h2 id="employee-dialog-title">직원 등록</h2>
        <button class="dialog-close" type="button" data-close-dialog aria-label="팝업 닫기">×</button>
      </div>
      <input id="employee-id" type="hidden">
      <div class="employee-form-grid">
        <label>직원 구분
          <select id="employee-type" required>
            <option value="STAFF">일반 직원</option>
            <option value="DOCTOR">의사</option>
          </select>
        </label>
        <label>이름
          <input id="employee-name" type="text" maxlength="50" required>
        </label>
        <label><span id="department-label">부서</span>
          <select id="employee-department" required></select>
        </label>
        <label id="position-field">직함
          <input id="employee-position" type="text" maxlength="50">
        </label>
        <fieldset id="available-days-field" hidden>
          <legend>진료 가능 요일</legend>
          <div id="available-days" class="available-days"></div>
        </fieldset>
        <label>생년월일
          <input id="employee-birth-date" type="date" required>
        </label>
        <label>재직 상태
          <select id="employee-status" required>
            <option value="Y">재직 중</option>
            <option value="L">휴직 중</option>
            <option value="N">퇴사</option>
          </select>
        </label>
        <label>노출 순서
          <input id="employee-display-order" type="number" min="0" value="1" required>
        </label>
      </div>
      <p id="employee-form-message" class="dialog-message" role="status"></p>
      <div class="dialog-actions">
        <button type="button" data-close-dialog>취소</button>
        <button id="employee-save-button" class="primary-action" type="submit">저장</button>
      </div>
    </form>
  </dialog>
  <script src="/admin/employees.js?v=3"></script>
</body>
</html>
