<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="편안하고 쉬운 병원 예약 안내">
  <title>늘봄의원 | 편안한 진료 예약</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="landing-shell">
    <section class="hero" aria-labelledby="hero-title">
      <p class="eyebrow">늘봄의원 진료 예약</p>
      <h1 id="hero-title">건강한 오늘,<br><strong>늘봄의원</strong>이 함께합니다.</h1>
      <p class="hero-copy">어려운 절차 없이, 필요한 진료를<br>편안하게 예약하세요.</p>

      <div class="hero-actions" aria-label="주요 메뉴">
        <button class="action-card inquiry-card" type="button" data-open="contact-choice">
          <span class="action-icon" aria-hidden="true">?</span>
          <span>문의하기</span>
          <small>궁금한 점을 물어보세요</small>
        </button>
        <button class="action-card reservation-card" type="button" data-open="reservation-dialog">
          <span class="action-icon" aria-hidden="true">✓</span>
          <span>예약하기</span>
          <small>원하는 날짜와 시간을 선택하세요</small>
        </button>
      </div>

      <p class="support-text">진료시간&nbsp; 평일 09:00 - 18:00&nbsp; · &nbsp;토요일 09:00 - 13:00</p>
    </section>
    <aside class="comfort-panel" aria-label="병원 안내">
      <span class="sun" aria-hidden="true"></span>
      <div class="panel-content">
        <p>가까이에서, 천천히</p>
        <strong>당신의 건강을<br>돌보겠습니다.</strong>
      </div>
      <div class="leaf leaf-one" aria-hidden="true"></div>
      <div class="leaf leaf-two" aria-hidden="true"></div>
    </aside>
  </main>

  <dialog id="contact-choice" class="dialog dialog-small" aria-labelledby="contact-choice-title">
    <button class="close-button" type="button" data-close aria-label="닫기">×</button>
    <p class="dialog-kicker">문의하기</p>
    <h2 id="contact-choice-title">어떤 방법으로<br>도와드릴까요?</h2>
    <a class="choice-button phone-choice" href="tel:02-0000-0000">
      <span>전화하기</span>
      <strong>02-0000-0000</strong>
    </a>
    <button class="choice-button form-choice" type="button" data-switch="inquiry-dialog">
      <span>1:1 문의하기</span>
      <strong>문의 내용을 남겨주세요</strong>
    </button>
  </dialog>

  <dialog id="inquiry-dialog" class="dialog" aria-labelledby="inquiry-title">
    <button class="close-button" type="button" data-close aria-label="닫기">×</button>
    <p class="dialog-kicker">1:1 문의</p>
    <h2 id="inquiry-title">궁금한 점을<br>남겨주세요.</h2>
    <form id="inquiry-form" class="form-grid">
      <label>이름<input name="name" autocomplete="name" required></label>
      <div class="form-two-columns">
        <label>전화번호<input name="phoneNumber" type="tel" inputmode="numeric" autocomplete="tel" placeholder="010-0000-0000" pattern="010-[0-9]{4}-[0-9]{4}" maxlength="13" title="010-0000-0000 형식으로 입력해 주세요."></label>
        <label>이메일<input name="email" type="email" autocomplete="email" placeholder="example@email.com"></label>
      </div>
      <p class="field-hint">전화번호 또는 이메일 중 하나는 꼭 입력해 주세요.</p>
      <label>문의 내용<textarea name="content" rows="4" required></textarea></label>
      <label class="checkbox-label"><input name="privacyAgreed" type="checkbox" required> 개인정보 수집 및 이용에 동의합니다.</label>
      <p class="form-message" aria-live="polite"></p>
      <button class="submit-button" type="submit">문의 전송하기</button>
    </form>
  </dialog>

  <dialog id="reservation-dialog" class="dialog reservation-dialog" aria-labelledby="reservation-title">
    <button class="close-button" type="button" data-close aria-label="닫기">×</button>
    <div class="reservation-scroll-content">
      <p class="dialog-kicker">진료 예약</p>
      <h2 id="reservation-title">편한 시간에<br>예약하세요.</h2>
      <form id="reservation-form" class="form-grid">
      <label>이름<input name="name" autocomplete="name" required></label>
      <label>전화번호<input name="phoneNumber" type="tel" inputmode="numeric" autocomplete="tel" placeholder="010-0000-0000" pattern="010-[0-9]{4}-[0-9]{4}" maxlength="13" title="010-0000-0000 형식으로 입력해 주세요." required></label>
      <div class="form-two-columns">
        <label>진료과
          <select id="reservation-department" name="department" required>
            <option value="">진료과를 불러오는 중입니다</option>
          </select>
        </label>
        <label>의료진
          <select id="reservation-doctor" name="doctorId" required disabled>
            <option value="">진료과를 먼저 선택해 주세요</option>
          </select>
        </label>
      </div>
      <div class="form-two-columns">
        <div class="date-field">
          <span class="field-label">날짜</span>
          <input id="reservation-date" name="date" type="hidden">
          <button id="calendar-toggle" class="calendar-toggle" type="button" aria-expanded="false" aria-controls="calendar-picker">날짜를 선택해 주세요</button>
          <div id="calendar-picker" class="calendar-picker" hidden>
            <div class="calendar-header">
              <button id="calendar-previous" type="button" aria-label="이전 달">‹</button>
              <strong id="calendar-month" aria-live="polite"></strong>
              <button id="calendar-next" type="button" aria-label="다음 달">›</button>
            </div>
            <div class="calendar-weekdays" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
            <div id="calendar-grid" class="calendar-grid" role="grid" aria-label="예약 날짜 선택"></div>
          </div>
        </div>
        <label>시간대<select id="reservation-time-slot" name="appointmentTime" required disabled><option value="">날짜를 먼저 선택해 주세요</option></select></label>
      </div>
      <p id="schedule-message" class="field-hint" aria-live="polite">일요일은 휴진입니다.</p>
      <label>증상<textarea name="symptom" rows="3" maxlength="2000" placeholder="현재 불편한 증상을 적어주세요."></textarea></label>
      <label class="checkbox-label"><input name="privacyAgreed" type="checkbox" required> 개인정보 수집 및 이용에 동의합니다.</label>
      <p class="form-message" aria-live="polite"></p>
        <button class="submit-button" type="submit">예약 신청하기</button>
      </form>
    </div>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
