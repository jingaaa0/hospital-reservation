services:
  postgres:
    image: postgres:16-alpine
    container_name: hospital-reservation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hospital_reservation}
      POSTGRES_USER: ${POSTGRES_USER:-hospital_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
      TZ: Asia/Seoul
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
