spring.application.name=hospital-reservation

# Local Docker PostgreSQL connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hospital_reservation}
spring.datasource.username=${DB_USERNAME:hospital_admin}
spring.datasource.password=${DB_PASSWORD:local_dev_password}

# Flyway owns schema changes; Hibernate only verifies entity/schema compatibility.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Admin credentials (always override these values in production)
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:change-me}
admin.name=${ADMIN_NAME:최고 관리자}
